
name: development

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "alembic upgrade head || { echo 'Alembic migration failed'; exit 1; }"
    env_file:
      - .env
    volumes:
      # Монтируем код для миграций
      - ./src:/app/src:rw
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./poetry.lock:/app/poetry.lock:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend
  fastapi_main_service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Монтируем код для мгновенного hot-reload
      - ./src:/app/src:rw
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./poetry.lock:/app/poetry.lock:ro
    command: sh -c "
        uvicorn src.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir src
        "
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - backend
      - app-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - fastapi_main_service_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server
      --appendonly yes
    volumes:
      - fastapi_main_service_redis_data:/data
    networks:
      - backend

  # === Удобные GUI-инструменты ===
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - backend

volumes:
  fastapi_main_service_postgres_data:
  fastapi_main_service_redis_data:
  fastapi_main_service_pgadmin_data:

networks:
  backend:
    driver: bridge
  app-network:
    driver: bridge
